<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #d0e7ff;">
    <div style="background-color: #d0e7ff; color: #002366; text-align: center; padding: 15px 0; font-size: 20px; font-weight: bold; position: relative;">
        <a href="#" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #002366; text-decoration: none;">←</a>
        Feedback
    </div>
    <div style="margin: 20px;">
        <p style="font-size: 14px; color: #333; margin-bottom: 20px;">
            Hai! Kami ingin dengar pendapat kamu nih 😊<br>
            Yuk, kasih tahu kami apa yang kamu suka dan apa yang bisa kami perbaiki!
        </p>
        <p style="font-size: 14px; color: #333; margin-bottom: 10px;">Berikan Kritik dan Saran Anda</p>
        <div style="margin-bottom: 20px;">
            <label for="name" style="display: block; font-size: 14px; color: #333; margin-bottom: 5px;">Nama</label>
            <input type="text" id="name" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
        </div>
        <div style="margin-bottom: 20px;">
            <label for="feedback" style="display: block; font-size: 14px; color: #333; margin-bottom: 5px;">Masukan</label>
            <textarea id="feedback" rows="5" style="width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
        </div>
        <a href="#" style="display: block; width: 100%; padding: 10px; font-size: 16px; font-weight: bold; color: white; background-color: #002366; border: none; border-radius: 5px; text-align: center; text-decoration: none;">KIRIM</a>
    </div>
</body>
</html>
