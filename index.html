<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Buddy</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #ffffff;
            background-color: #f5f5f5;
        }

        h1, h2, p {
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        #landing-page {
            background-color: #003399;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #landing-page .logo img {
            width: 150px;
            margin-bottom: 20px;
        }

        #landing-page h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #landing-page p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <section id="landing-page" class="section">
        <div class="container">
            <div class="logo">
                <img src="images/logoputih.png" alt="Logo Budget Buddy">
            </div>
            <h1>BUDGET BUDDY</h1>
            <p>Mudah Kelola, Bebas Khawatir</p>
        </div>
    </section>
</body>
</html>
