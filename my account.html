<!DOCTYPE html>
<html lang="en">
<head>

<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #d0e7ff;">

        </div>

            <label style="font-size: 16px; color: #333;">Email</label>

        </div>

            <label style="font-size: 16px; color: #333;">No. Hp</label>
            <span style="font-size: 16px; color: #888;">+62 ···· 773 <span style="color: #888; font-size: 16px;">➔</span></span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px;">
            <label style="font-size: 16px; color: #333;">Password</label>
            <span style="font-size: 16px; color: #888;">******* <span style="color: #888; font-size: 16px;">➔</span></span>
