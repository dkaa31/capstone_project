<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Buddy - Tambah Catatan</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color: #e6f0ff; color: #003399;">
    <!-- Header -->
    <header style="padding: 15px; background-color: #003399; color: #ffffff;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #ffffff;">←</button>
            <h1 style="margin: 0; font-size: 1.2rem;">Tambahkan Catatan</h1>
        </div>

        <!-- Tab Navigation -->
        <div style="display: flex; margin-top: 15px;">
            <button style="flex: 1; padding: 8px; background: none; border: none; color: #ffffff;">Pengeluaran</button>
            <button style="flex: 1; padding: 8px; background-color: rgba(255, 255, 255, 0.2); border: none; color: #ffffff;">Pemasukan</button>
        </div>
    </header>

    <div style="background-color: #003399; padding: 8px; color: #ffffff;">
        <div style="background-color: #ffffff; border-radius: 5px; padding: 8px; display: flex; align-items: center; justify-content: space-between;">
            <input type="text" value="Rp." style="border: none; font-size: 0.9rem; color: #003399; width: 90%; outline: none;">
            <button style="background: none; border: none; cursor: pointer;">
                <img src="calculator-icon.png" alt="Calculator" style="width: 18px; height: 14px;">
            </button>
        </div>
    </div>

    <!-- Form Content -->
    <div style="padding: 15px;">
        <!-- Note Input -->
        <div style="margin-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <img src="note-icon.png" alt="Note" style="width: 14px; height: 14px;">
                <span style="color: #003399; font-size: 0.9rem;">Pesan</span>
            </div>
            <input type="text" placeholder="Tambahkan pesan" style="width: 100%; padding: 6px; border: 1px solid #ccd9f2; border-radius: 5px; outline: none; font-size: 0.9rem;">
        </div>

        <!-- Category Selection -->
        <div style="margin-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                <img src="category-icon.png" alt="Category" style="width: 18px; height: 18px;">
                <span style="color: #003399; font-size: 0.9rem;">Kategori</span>
            </div>
            <button style="width: 100%; padding: 6px; text-align: left; background-color: #ffffff; border: 1px solid #ccd9f2; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                <span>Keluarga</span>
                <span>→</span>
            </button>
        </div>

        <!-- Number Pad -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; margin-top: 15px;">
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">1</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">2</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">3</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">4</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">5</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">6</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">7</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">8</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">9</button>
            <button style="padding: 15px; background: none; border: none; cursor: pointer;">
                <img src="fingerprint-icon.png" alt="Fingerprint" style="width: 35px; height: 35px;">
            </button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #003399;">0</button>
            <button style="padding: 15px; font-size: 1.2rem; background: none; border: none; cursor: pointer; color: #000000;">←</button>
        </div>

        <!-- Submit Button -->
        <button style="width: 100%; padding: 12px; background-color: #003399; color: #ffffff; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; margin-bottom: 60px;">Kirim</button>
    </div>

    <!-- Bottom Navigation -->
    <nav style="position: fixed; bottom: -15px; width: 100%; background-color: #003399; padding: 15px 0 35px 0; display: flex; justify-content: space-around;">
        <a href="#" style="text-decoration: none; color: #ffffff; text-align: center;">
            <img src="home-icon.png" alt="Home" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
            <p style="margin: 5px 0; font-size: 0.8rem;">HOME</p>
        </a>
        <a href="#" style="text-decoration: none; color: #ffffff; text-align: center;">
            <img src="history-icon.png" alt="History" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
            <p style="margin: 5px 0; font-size: 0.8rem;">HISTORY</p>
        </a>
        <a href="#" style="text-decoration: none; color: #ffffff; text-align: center;">
            <img src="analysis-icon.png" alt="Analysis" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
            <p style="margin: 5px 0; font-size: 0.8rem;">ANALYSIS</p>
        </a>
        <a href="#" style="text-decoration: none; color: #ffffff; text-align: center;">
            <img src="account-icon.png" alt="Account" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
            <p style="margin: 5px 0; font-size: 0.8rem;">ACCOUNT</p>
        </a>
    </nav>
</body>
</html>
